<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bv-grad)" stroke="#3f3f46" stroke-width="2" />
  
  <!-- Outer Vault Dial Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#faf8f5" stroke-width="2.5" stroke-dasharray="4 2" />
  <circle cx="32" cy="32" r="16.5" fill="#18181b" stroke="#e4e4e7" stroke-width="2" />
  
  <!-- Vault Wheel Spokes -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#faf8f5" stroke-width="2.5" stroke-linecap="round" />
  <line x1="18" y1="32" x2="46" y2="32" stroke="#faf8f5" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central Dial with Red Core -->
  <circle cx="32" cy="32" r="7.5" fill="#09090b" stroke="#faf8f5" stroke-width="2" />
  <circle cx="32" cy="32" r="3.5" fill="#dc2626" />
  
  <!-- Precision Indicator Notch -->
  <rect x="30.5" y="11" width="3" height="4" rx="1.5" fill="#dc2626" />
</svg>
