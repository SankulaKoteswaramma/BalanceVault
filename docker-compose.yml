services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache & Rate Limiting Store
  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BalanceVault Express API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balancevault-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/balancevault?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: balancevault_production_super_secret_jwt_key_min_32_bytes!
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: balancevault_production_refresh_token_secret_min_32_bytes!
      REFRESH_TOKEN_EXPIRES_IN: 7d
      BOOTSTRAP_SECRET: balancevault_bootstrap_secret_token_secure_2026_challenge!
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # BalanceVault React Frontend (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balancevault-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
